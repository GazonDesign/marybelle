name: Mary Belle CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  # ── Линт и проверка типов ─────────────────────────────
  lint:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm install

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit
        continue-on-error: true

  # ── Сборка ────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm install

      - name: Build Next.js
        run: npm run build
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'ci-build-placeholder-secret-at-least-32-chars-long' }}

      - name: Check build output
        run: |
          test -f .next/BUILD_ID
          echo "BUILD_ID: $(cat .next/BUILD_ID)"
          echo "Build size: $(du -sh .next | cut -f1)"
